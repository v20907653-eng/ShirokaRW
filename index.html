<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HolyVisuals - Меню функций</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-bg: #141418;
            --card-bg: #1c1c22;
            --card-hover: #25252d;
            --text-main: #ffffff;
            --text-muted: #8b8b99;
            --accent-blue: #3b82f6; /* Синий цвет из скрина */
            --accent-glow: rgba(59, 130, 246, 0.5);
            --border-color: #2a2a35;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(circle at top right, rgba(59, 130, 246, 0.1), transparent 40%);
        }

        /* Главное окно (как на скрине) */
        .menu-container {
            width: 100%;
            max-width: 1000px;
            background-color: var(--panel-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        /* Шапка */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--accent-blue);
        }

        /* Поиск */
        .search-bar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            width: 250px;
            transition: border-color 0.3s;
        }

        .search-bar:focus-within {
            border-color: var(--accent-blue);
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: var(--text-main);
            outline: none;
            width: 100%;
            font-size: 14px;
            margin-left: 10px;
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        /* Категории (Вкладки) */
        .categories {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .cat-btn {
            background-color: var(--card-bg);
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cat-btn:hover {
            background-color: var(--card-hover);
            color: var(--text-main);
        }

        .cat-btn.active {
            background-color: var(--accent-blue);
            color: #fff;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Сетка функций (как на скрине) */
        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 10px;
        }

        /* Скроллбар */
        .features-grid::-webkit-scrollbar {
            width: 6px;
        }
        .features-grid::-webkit-scrollbar-track {
            background: transparent;
        }
        .features-grid::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        /* Карточка функции */
        .feature-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            cursor: pointer;
        }

        .feature-item:hover {
            background-color: var(--card-hover);
            border-color: #3a3a45;
        }

        .feature-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .feature-icon {
            width: 20px;
            height: 20px;
            fill: var(--accent-blue);
        }

        .feature-name {
            font-size: 15px;
            font-weight: 500;
        }

        /* Тумблер (Переключатель) */
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #3a3a45;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: #fff;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-blue);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Кнопка скачивания (внизу) */
        .download-area {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
        }

        .btn-download {
            background: linear-gradient(135deg, var(--accent-blue), #2563eb);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .features-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .search-bar {
                width: 100%;
            }
            .categories {
                overflow-x: auto;
                padding-bottom: 5px;
            }
            .cat-btn {
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>

            <div class="feature-item">

                    <span class="slider"></span>

            </div>

            <!-- Карточка 2 -->
            <div class="feature-item">
                <div class="feature-info">
                    <svg class="feature-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    <span class="feature-name">Arrow Nametag</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Карточка 3 -->
            <div class="feature-item">
                <div class="feature-info">
                    <svg class="feature-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    <span class="feature-name">Block Overlay</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Карточка 4 -->
            <div class="feature-item">
                <div class="feature-info">
                    <svg class="feature-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>

                </div>
                <label class="toggle-switch">
                    <input type="checkbox" checked>

                </label>
            </div>

            <!-- Карточка 5 -->
            <div class="feature-item">
                <div class="feature-info">
                    <svg class="feature-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    <span class="feature-name">Armor Durability View</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Карточка 6 -->
            <div class="feature-item">
                <div class="feature-info">
                    <svg class="feature-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                    <span class="feature-name">Aspect Ratio</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" checked>

            </div>

            <!-- Карточка 7 -->
            <div class="feature-item">

        <!-- Кнопка скачивания -->
        <div class="download-area">
            <button id="downloadBtn" class="btn-download">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                СКАЧАТЬ HOLYVISUALS.ZIP
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const downloadBtn = document.getElementById('downloadBtn');

            // Логика переключения вкладок (для красоты)
            const catBtns = document.querySelectorAll('.cat-btn');
            catBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    catBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });

            // Логика скачивания
            downloadBtn.addEventListener('click', () => {
                const fileUrl = 'holyvisuals.zip'; 
                const fileName = 'HolyVisuals_v1.0.zip';

                const link = document.createElement('a');
                link.href = fileUrl;
                link.download = fileName;
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // Анимация кнопки
                const originalText = downloadBtn.innerHTML;
                downloadBtn.innerHTML = '✔ СКАЧИВАНИЕ...';
                downloadBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                
                setTimeout(() => {
                    downloadBtn.innerHTML = originalText;
                    downloadBtn.style.background = 'linear-gradient(135deg, #3b82f6, #2563eb)';
                }, 3000);
            });
        });
    </script>
</body>
</html>
